<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voucher del depósito</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="panel">
      <section class="voucher-card">
        <div class="voucher-header">
          <span id="voucherTitle" class="voucher-title">Voucher del depósito</span>
        </div>
        <div id="voucherBody" class="voucher-body">
          <div class="queue-empty">
            Abre un depósito y usa el botón "Panel Lateral" en su detalle para mostrarlo acá.
          </div>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
